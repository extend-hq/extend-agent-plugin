name: Sync skills from their source repos

# The bundled skills are derived artifacts: extend-api comes from the served
# docs (agents.md) and extend-cli from the CLI binary's own `extend skill`
# output. This workflow refreshes both, normalizes the text (marketplace
# listing copy bans em dashes), and auto-merges a PR when anything drifted.
# Source repos push to us: the documentation repo dispatches after Fern
# publishes and extend-cli dispatches after a release, so drift lands within
# minutes. The weekly cron is a backstop in case a dispatch is missed.

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC backstop
  workflow_dispatch: {}
  repository_dispatch:
    types: [sync-skills]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate extend-api (frontmatter + served agents.md)
        run: |
          { sed -n '1,4p' skills/extend-api/SKILL.md; curl -fsSL https://docs.extend.ai/agents.md; } > /tmp/extend-api.md
          mv /tmp/extend-api.md skills/extend-api/SKILL.md

      - name: Install the latest extend CLI release
        run: |
          curl -fsSL https://extend.ai/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Regenerate extend-cli (emitted by the CLI)
        run: |
          extend version
          extend skill > skills/extend-cli/SKILL.md

      - name: Normalize (no em dashes in public copy)
        run: |
          python3 - <<'EOF'
          import pathlib
          for p in pathlib.Path("skills").glob("*/SKILL.md"):
              text = p.read_text()
              text = text.replace(" \u2014 ", " - ").replace("\u2014", " - ")
              p.write_text(text)
          EOF

      - name: Open a PR if the skills drifted
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/skills
          title: "Sync skills from their source repos"
          commit-message: "Sync skills from their source repos"
          body: |
            Automated refresh of the bundled skill snapshots:

            - `skills/extend-api/SKILL.md` from https://docs.extend.ai/agents.md
            - `skills/extend-cli/SKILL.md` from the latest CLI release's `extend skill`

            Em dashes normalized per repo policy. Merging this will trigger
            marketplace re-review on platforms that watch the repo.
          delete-branch: true

      # Skills are generated snapshots, so there is nothing for a human to
      # review; the PR exists only as an audit record of each sync.
      - name: Merge the sync PR
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --delete-branch "${{ steps.pr.outputs.pull-request-number }}"
