name: Sync skills from their source repos

# The bundled skills are derived artifacts: extend-api comes from the served
# docs (agents.md) and extend-cli from the CLI binary's own `extend skill`
# output. This workflow refreshes both, normalizes the text (marketplace
# listing copy bans em dashes), and pushes directly to main when anything
# drifted (the org forbids Actions-created PRs, and the snapshots have no
# human review step anyway). Source repos push to us: the documentation repo
# dispatches after Fern publishes and extend-cli dispatches after a release,
# so drift lands within minutes.

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [sync-skills]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate extend-api (frontmatter + served agents.md)
        run: |
          { sed -n '1,4p' skills/extend-api/SKILL.md; curl -fsSL https://docs.extend.ai/agents.md; } > /tmp/extend-api.md
          mv /tmp/extend-api.md skills/extend-api/SKILL.md

      - name: Install the latest extend CLI release
        run: |
          curl -fsSL https://extend.ai/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Regenerate extend-cli (emitted by the CLI)
        run: |
          extend version
          extend skill > skills/extend-cli/SKILL.md

      - name: Normalize (no em dashes in public copy)
        run: |
          python3 - <<'EOF'
          import pathlib
          for p in pathlib.Path("skills").glob("*/SKILL.md"):
              text = p.read_text()
              text = text.replace(" \u2014 ", " - ").replace("\u2014", " - ")
              p.write_text(text)
          EOF

      - name: Commit and push if the skills drifted
        run: |
          if git diff --quiet -- skills; then
            echo "Skills match their sources; nothing to sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills
          git commit -m "Sync skills from their source repos" \
            -m "extend-api from https://docs.extend.ai/agents.md; extend-cli from the latest CLI release's 'extend skill'. Em dashes normalized. Pushing to main may trigger marketplace re-review."
          git push
